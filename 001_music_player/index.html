<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title class="web-title">Music Player</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./assets/icon.png" type="image/x-icon" />
  </head>
  <body>
    <main>
      <div class="inner">
        <section>
          <div class="pixel-lights" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="header">
            <p>Now playing</p>
          </div>

          <div class="cover">
            <div class="disc-label" aria-hidden="true"></div>
            <img src="" alt="Album cover" />
          </div>

          <audio></audio>

          <div class="title">
            <h2>Music Name</h2>
          </div>

          <div class="range-div">
            <span class="current-time">0:00</span>
            <input min="0" max="100" value="0" class="progress" type="range" />
            <span class="duration">0:00</span>
          </div>

          <div class="btns">
            <button class="prev-btn" aria-label="Previous song">⏮</button>
            <button class="play-btn" aria-label="Play or pause">▶</button>
            <button class="next-btn" aria-label="Next song">⏭</button>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="script.js"></script>
    <script src="oneko.js"></script>
  </body>
</html>
