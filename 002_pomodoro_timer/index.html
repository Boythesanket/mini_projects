<!doctype html>
<html lang="en" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body>
    <main class="border min-h-screen w-full">
      <nav class="w-full border text-center p-5 lg:text-2xl font-[Bungee]">
        <h1>Pomodoro</h1>
      </nav>

      <div class="w-full border p-2 flex justify-center">
        <div
          class="border-5 rounded-full lg:min-w-100 lg:min-h-100 md:min-w-100 md:min-h-100 min-w-70 min-h-70 flex items-center justify-center"
        >
          <h1 class="lg:text-8xl text-5xl md:text-7xl font-[Bungee]">20:00</h1>
        </div>
      </div>
    </main>
  </body>
</html>
