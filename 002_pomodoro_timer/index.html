<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still — Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <main class="page">
      <section class="timer-card" aria-labelledby="timer-title">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-header">
          <span class="status-dot"></span> a quiet moment for yourself
        </div>

        <p class="session-label">Focus</p>
        <h1 id="timer-title" class="timer">25<span>:</span>00</h1>
        <p class="timer-note">minutes remaining</p>

        <button class="start-button" type="button"><i></i> Start</button>

        <nav class="mode-pills" aria-label="Timer mode">
          <button class="active" type="button">Focus</button>
          <button type="button" class="short" onclick="shortBreak()">Short Break</button>
          <button type="button" class="long" onclick="longBreak()">Long Break</button>
        </nav>

        <p class="quote">Take it one gentle moment at a time.</p>

        <div class="coffee" aria-hidden="true"><span></span><i></i><i></i></div>
        <div class="plant" aria-hidden="true">
          <i></i><i></i><i></i><i></i><span></span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
